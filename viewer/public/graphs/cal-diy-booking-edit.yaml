# Same graph as cal-diy-booking.yaml with a developer edit overlay applied.
version: 1
repo: calcom/cal.diy
commit: 6bfe2df9d13c456dc9374c9e6581b36fba188728
title: 'Cal.diy — booking subsystem (developer edit: Booked Appointments page)'
description: >-
  The same graph with a developer edit applied, as in Figure 2 of the proposal: add a **Booked
  appointments page** that becomes the attendee landing page after booking, replacing the direct
  redirect to the success page. Green = new, amber = modified, red = deleted.
groups:
  - id: public-booking
    label: Public booking flow
    summary: What an attendee sees when they open someone's booking link.
  - id: booker-ui
    label: Booker UI
    parent: public-booking
    summary: The client-side booking widget and its pieces.
  - id: api
    label: HTTP / tRPC endpoints
  - id: domain
    label: Booking domain services
  - id: availability
    label: Availability & slots
  - id: side-effects
    label: Side effects after booking
  - id: data
    label: Data models
  - id: organizer
    label: Organizer dashboard
nodes:
  - id: user-profile-page
    label: User profile page
    kind: page
    group: public-booking
    routes:
      - /[user]
    summary: Lists a user's public event types.
    description: |
      Public landing page for a username. Shows the user's avatar, bio and
      the list of bookable event types; clicking one navigates to the event
      booking page.
    files:
      - path: apps/web/app/(booking-page-wrapper)/[user]/page.tsx
        role: route
      - apps/web/modules/users/views/users-public-view.tsx
    provenance: manual
  - id: event-booking-page
    label: Event booking page
    kind: page
    group: public-booking
    routes:
      - /[user]/[type]
      - /d/[link]/[slug]
    summary: Hosts the Booker widget for one event type.
    description: |
      Server-rendered page for a single event type. Loads the public event
      data on the server, then renders the **Booker** widget. Also reached
      through private links (`/d/[link]/[slug]`) and the embed route.
    files:
      - path: apps/web/app/(booking-page-wrapper)/[user]/[type]/page.tsx
        role: route
      - apps/web/app/(booking-page-wrapper)/[user]/[type]/embed/page.tsx
      - apps/web/app/(booking-page-wrapper)/d/[link]/[slug]/page.tsx
      - apps/web/modules/users/views/users-type-public-view.tsx
      - apps/web/app/(booking-page-wrapper)/layout.tsx
    provenance: manual
  - id: booking-success-page
    label: Booking success page
    kind: page
    group: public-booking
    routes:
      - /booking/[uid]
      - /booking-successful/[uid]
    summary: Confirmation page after a booking; also cancel/reschedule entry.
    description: |
      Shows the booked slot, attendees and location. From here an attendee
      can cancel or request a reschedule, and rate the host after the meeting.
    files:
      - path: apps/web/app/(booking-page-wrapper)/booking/[uid]/page.tsx
        role: route
      - apps/web/app/(booking-page-wrapper)/booking-successful/[uid]/page.tsx
      - apps/web/modules/bookings/views/bookings-single-view.tsx
      - apps/web/modules/bookings/views/bookings-single-view.getServerSideProps.tsx
      - apps/web/modules/bookings/components/BookingSuccessCard.tsx
      - apps/web/components/booking/CancelBooking.tsx
