    x-source-evidence:
      - path: apps/web/app/api/auth/signup/route.ts
        start_line: 55
        end_line: 68
    note: "Handle an invitation for an existing account before the signup flow performs account creation or consumes the invitation. Apply the same decision in both the hosted and self-hosted signup handlers (calcomHandler and selfHostedHandler): validate the invite token, determine the invited email, and check whether it already belongs to an account. Return an explicit HTTP 409 response identifying USER_ALREADY_EXISTS so the client can send that person through login. Keep the invitation usable by the proper existing-account flow, and preserve normal signup for a new invited user and for a user signing up without a token. Also handle a concurrent duplicate-account creation attempt through the existing Prisma unique-constraint error path, distinguishing the relevant account conflict from unrelated errors. Do not turn every server error into an existing-user redirect, and do not continue with billing and membership side effects after a rejected signup. In the signup UI: send the signup request through fetchSignup and use its result helpers to recognize an existing user or a checkout-session continuation without duplicating parsing logic; show the translated explanation before redirecting an existing invitee to login, while preserving the checkout path for other signup outcomes."
