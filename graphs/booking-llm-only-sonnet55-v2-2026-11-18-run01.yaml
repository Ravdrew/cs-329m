title: Cal.diy booking subsystem
description: Component graph of the web booking subsystem - public booker UI, booking management UI, web/tRPC APIs, slot computation, booking lifecycle (create/confirm/decline/reschedule/cancel, recurring, seated), persistence and side-effect services.
x-scope:
  included:
    - apps/web booking pages, modules/bookings UI and hooks, /api/book/*, /api/cancel
    - packages/trpc viewer bookings and slots routers
    - packages/features/bookings (services, handleNewBooking, handleSeats, cancel, confirm, payment, tasker, repositories)
    - availability/busy-time/slot computation, selected slot reservations
    - webhooks dispatch/scheduling, email-manager, booking audit, EventManager calendar/video
  excluded:
    - apps/api/v2 (platform API)
    - generic UI kit, auth utilities, i18n, logging helpers
    - provider-specific app-store implementations (calendar, video, payment providers) shown as boundary nodes
