title: Cal.com web product - booking component graph
description: Component graph of the Cal.com web booking product (public booking, booking management, availability, calendars, event types, app store, auth, embeds, webhooks, tasks, notifications, data tables, persistence).
x-scope:
  included:
    - Public booking pages and Booker UI
    - Booking creation, recurring, instant, seated, cancel, confirm/reject and reschedule request flows
    - Availability, slots, schedules, busy times
    - Calendar manager, event manager, calendar subscription cache and sync
    - Event types and form builder
    - App store framework and calendar, video, CRM, payment integration families
    - Auth, signup, OAuth provider
    - Embeds, webhooks, tasker, feature flags, emails and SMS, data tables
    - Prisma persistence as a boundary model
  excluded:
    - API v1 and v2, platform SDK and atoms
    - Enterprise-only features (workflows shown only as a boundary)
    - Marketing and example apps, generic UI primitives, build tooling
