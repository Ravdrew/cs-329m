title: Cal.com booking product component graph
description: Component graph of calcom/cal.diy covering booking lifecycle, availability/slots, calendars, event types, app store integrations, notifications, webhooks/tasks, auth and persistence.
x-scope:
  included:
    - Public booking pages and Booker UI
    - Booking creation, seats, instant meetings, confirmation, rejection, cancellation, reschedule requests, round-robin reassignment
    - Availability, slots, reservations, schedules, out of office
    - Calendars, calendar cache, EventManager, video, CRM integrations
    - Event types editor and form builder
    - App store shared framework and integration families (calendar, CRM, video, payment)
    - Payments and refunds
    - Emails, SMS, workflow reminders
    - Webhooks, tasker, cron, feature flags
    - Signup, NextAuth login, OAuth, credentials
    - Embeds, data tables and filter segments
    - tRPC and web HTTP API entrypoints, Prisma persistence
  excluded:
    - API v1 and v2 (apps/api)
    - Platform SDK and atoms (only the Booker web wrapper is listed with the Booker)
    - Enterprise-only features (org billing, SSO, dsync, PBAC)
    - Marketing and example apps
    - Generic UI primitives (packages/ui)
    - Build tooling
