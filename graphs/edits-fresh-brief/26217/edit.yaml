title: Cal.com booking product component graph
description: Component graph of public booking, booking management, availability, calendars, app store, webhooks/tasks, auth, embeds and persistence in calcom/cal.diy.
x-scope:
  included:
    - Public booker UI, booking pages, booking create/cancel/confirm/reschedule services
    - Slots, availability, schedules, busy times
    - Calendars, calendar subscription cache and sync, EventManager
    - Event types, booking fields, routing form submissions
    - App store framework and calendar, CRM, video, payment integration families
    - Webhooks, tasker, no-show triggers, feature flags, workflows
    - Emails and SMS notifications
    - Signup, credentials auth, OAuth, email verification
    - Embeds, data tables and filter segments, tRPC and web HTTP API routes
    - Prisma models behind these
  excluded:
    - API v1 and v2, platform SDK and atoms
    - Enterprise-only features beyond workflows and payments used by booking
    - Marketing and example apps
    - Generic UI primitives and build tooling
