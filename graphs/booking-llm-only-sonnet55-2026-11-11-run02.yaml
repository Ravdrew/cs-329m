            private async _getReservedSlotsAndCleanupExpired({
              bookerClientUid,
              usersWithCredentials,
              eventTypeId,
            }: {
              bookerClientUid: string | undefined;
              usersWithCredentials: NonNullable<GetAvailabilityUser>[];
