    summary: Next API route running turnstile, bot detection, rate limit then RegularBookingService.createBooking.
    description: Turnstile only when env flag is 1; checks bot detection via feature flag, rate-limits by hashed IP, reads session, sets creationSource WEBAPP and calls regularBookingService.createBooking with userId, hostname, forced slug.
