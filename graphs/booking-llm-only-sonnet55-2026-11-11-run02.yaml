description: |
  LLM-authored component graph of the booker UI, slot lookup/reservation (tRPC), booking creation (/api/book/event, RegularBookingService), reschedule, cancellation (/api/cancel) and host confirm/reschedule-request tRPC handlers, with the Prisma models they persist to. Edges describe calls verified in the cited ranges; external services (calendar/video, payments, webhooks, email) are reached through EventManager/handlers and only conditionally (dry run, seats, confirmation required, payment price).
