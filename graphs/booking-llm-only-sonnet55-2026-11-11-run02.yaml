            if (quickAvailabilityChecks && quickAvailabilityChecks.length > 0) {
              cachedQuickAvailabilityChecksRef.current = quickAvailabilityChecks;
            }

            return quickAvailabilityChecks || cachedQuickAvailabilityChecksRef.current;
