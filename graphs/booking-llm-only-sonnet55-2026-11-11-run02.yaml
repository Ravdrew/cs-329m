    - Reschedule via rescheduleUid on booker page and via RegularBookingService; host requestReschedule
    - POST/DELETE /api/cancel and handleCancelBooking
    - Host bookings confirm/reject and request-reschedule tRPC, booking success page, availability schedule router
    - Prisma Booking and SelectedSlots models
  excluded:
    - apps/api/v2 platform endpoints, API v1, atoms
    - Internals of EventManager, app-store integrations, email templates, webhooks, payment apps
    - Instant meetings, seated-event internals (handleSeats), team/round-robin host selection internals beyond ensureAvailableUsers
    - Bookings list UI, event-type editing, most availability schedule handler bodies, org/team admin
    - Tests
