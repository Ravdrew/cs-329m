title: Cal.com web product component graph
description: Component graph of the Cal.com web product (booking, availability, calendars, event types, auth, embeds, app store, notifications, persistence).
x-scope:
  included:
    - Public booking pages, Booker UI, booking lifecycle (create, seats, recurring, instant, confirm, reject, reschedule, cancel)
    - Availability, slots, schedules, out of office, busy times
    - Calendar integration framework, calendar cache and cron, calendar views and date picker
    - Event types, booking fields, form builder, routing forms
    - Signup, next-auth, OAuth token endpoints
    - Embed core and embed configuration UI
    - App store framework and integration families (calendar, video, CRM, payment)
    - Webhooks, tasker, cron routes, workflows reminders, email and SMS manager, feature flags
    - tRPC viewer routers, web HTTP API routes, data table, Prisma models
  excluded:
    - API v1 and v2, platform SDK and atoms
    - Enterprise-only features (organizations admin, SSO/SAML, dsync, insights) beyond boundary mentions
    - Marketing and example apps, generic UI primitives (packages/ui), build tooling
    - Tests, mocks, static assets, per-app individual integrations beyond family representatives
