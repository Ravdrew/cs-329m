title: Cal.diy booking, availability, reschedule, cancel and host-management paths
description: "LLM-authored component graph of the public booking flow in calcom/cal.diy: the Booker UI, slot (availability) tRPC queries, slot reservation, /api/book/event submission, RegularBookingService orchestration, Booking persistence, calendar/video integration via EventManager, payments and webhooks, rescheduling, cancellation, and host-side confirm and request-reschedule. API v2 is covered only at controller/service-handoff level. Where a step is conditional (dry run, seats, payment, confirmation required) the edge description says so."
x-scope:
  included:
    - Public booker page (/[user]/[type]) and BookerWebWrapper, useSchedule, useSlots, useBookings hooks
    - tRPC viewer.slots (getSchedule, reserveSlot, isAvailable, removeSelectedSlotMark) and AvailableSlotsService
    - /api/book/event, /api/book/recurring-event, RegularBookingService, RecurringBookingService, createBooking, ensureAvailableUsers, handleSeats
    - EventManager, handleWebhookTrigger and payment handoff in the booking service
    - Reschedule entry (/reschedule/[uid]) and the reschedule branch inside booking creation
    - /api/cancel route, CancelBooking UI, handleCancelBooking
    - Host management at tRPC viewer.bookings (confirm, requestReschedule) and the bookings list page
    - Prisma Booking and SelectedSlots models
    - API v2 bookings controller at handoff level
  excluded:
    - Internals of individual app-store calendar/video/payment integrations
    - Email and SMS templates, workflows, and tasker internals
    - Event type and availability schedule editing UIs
    - Instant meetings, routing forms, platform atoms, org/team admin features
    - Most of the API v2 service layer and bookings list view internals
    - Test files
