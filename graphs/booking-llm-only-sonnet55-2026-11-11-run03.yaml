    summary: Computes bookable slots from host schedules, busy times, limits, seats, OOO and reserved slots.
    description: Uses injected repos (selectedSlot, user, eventType, booking, OOO, schedule). It also uses the busyTimes, userAvailability, qualifiedHosts and checkBookingLimits services and a Redis slots cache. It reads unexpired reserved slots from other bookers and cleans up expired ones. Per-user availability comes from userAvailabilityService.getUsersAvailability.
