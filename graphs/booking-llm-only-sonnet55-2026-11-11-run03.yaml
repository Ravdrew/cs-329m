    label: handleWebhookTrigger
    kind: service
    group: submit
    summary: Fetches matching webhook subscribers and sends payloads, swallowing errors.
    description: Returns early on dry runs. Otherwise it calls getWebhooks and sendPayload for each subscriber, logging failures instead of throwing.
    files:
