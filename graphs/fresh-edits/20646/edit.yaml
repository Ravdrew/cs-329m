  - id: embed-element
    label: EmbedElement base custom element
    kind: component
    group: booking-ui
    summary: Shared base for the inline and modal embed elements that shows the skeleton or default loader.
    description: Holds theme, layout and page type for an embed, picks the skeleton content for them, toggles between skeleton and loader, and keeps the skeleton sized and themed.
    files:
      - packages/embeds/embed-core/src/EmbedElement.ts
    provenance: manual
    status: new
    note: Shows the skeleton when a page type is known, otherwise the default loader, and hides both when told the page has loaded. Skeleton follows the embed theme (light/dark), falling back to the system colour scheme and updating live when it changes; it adapts to the layout (mobile on small screens) and resizes with the window. The skeleton container keeps a height so the embed does not jump when the real content arrives; in a modal it is capped to the modal height.
  - id: embed-ui-utils
    label: Embed UI utilities
    kind: service
    group: booking-ui
    summary: Helpers for embed theme class, true layout, modal max height and dark colour scheme listening.
    files:
      - packages/embeds/embed-core/src/ui-utils.ts
    provenance: manual
    status: new
    note: Resolves the effective layout (mobile below a small width), whether a theme was explicitly chosen and the theme class to apply, and the max height for a modal. Provides one shared dark colour scheme query that listeners can subscribe to and unsubscribe from.
