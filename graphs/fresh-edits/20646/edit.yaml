title: Cal.com web booking product (cal.diy)
description: Component graph of the Cal.com web product — public booking, booking lifecycle, availability/slots, calendars, event types, auth, app store, notifications and persistence.
x-scope:
  included:
    - public booking pages, Booker UI, embeds
    - booking creation, reschedule, cancel, confirm/reject, seats, recurring, instant meetings
    - availability, slots, schedules, out-of-office, slot reservation
    - calendar manager, calendar cache and sync, calendar views
    - event types, form builder, routing forms
    - auth (next-auth, signup, OAuth), credentials
    - app store framework and calendar/CRM/video/payment integration families
    - webhooks, tasker, workflows, email, SMS
    - feature flags, data tables, tRPC API root, Prisma models
  excluded:
    - API v1 and v2, platform SDK and atoms
    - enterprise-only features, marketing and example apps
    - generic UI primitives, build tooling
