groups:
  - id: api
    label: tRPC and HTTP API
    summary: Root tRPC router, bookings router and HTTP routes.
  - id: appstore
    label: App store framework and integrations
    summary: Shared app store framework and integration families for calendar, video, CRM and payment.
  - id: auth
    label: Signup auth OAuth and credentials
    summary: Signup, NextAuth, OAuth provider and credential lifecycle.
  - id: availability
    label: Availability slots and schedules
    summary: Slot computation, busy times, schedules and slot reservation.
  - id: booking-core
    label: Booking lifecycle services
    summary: Create, reschedule, cancel, confirm, seats, recurring and instant bookings and their side effects.
  - id: booking-ui
    label: Booking UI and pages
    summary: Public booking pages, Booker widget, booking success and bookings list views.
  - id: boundary
    label: Out-of-scope boundaries
    summary: Code the product reaches but which is out of scope.
  - id: calendars
    label: Calendars cache and sync
    summary: Calendar manager, calendar cache, subscription webhooks and sync.
  - id: data-tables
    label: Data tables
    summary: Filterable tables and saved filter segments.
  - id: embeds
    label: Embeds
    summary: Embed core, iframe bridge and React wrapper.
  - id: eventtypes
    label: Event types and form building
    summary: Event type CRUD, public event data, booking fields and form builder.
  - id: notifications
    label: Email SMS and workflows
    summary: Transactional emails, SMS and workflow reminders.
  - id: persistence
    label: Persistence Prisma models
    summary: Prisma models owned by the booking product.
  - id: webhooks-tasks
    label: Webhooks tasker and flags
    summary: Webhook dispatch and scheduling, background tasker and feature flags.
