title: Cal.com booking product component graph
description: Component graph of calcom/cal.diy covering public booking, availability, calendars, event types, auth, embeds, app store, notifications, webhooks, tasker, flags, data tables and persistence.
x-scope:
  included:
    - public booking flow (Booker UI, /api/book/*, regular/recurring/instant/seated booking services)
    - booking management (cancel, confirm/decline, request reschedule, bookings list)
    - availability, slots, schedules, busy times
    - calendar manager, calendar cache, calendar subscriptions and sync
    - event types, form builder, booking fields
    - signup, next-auth, OAuth provider, credentials
    - embeds
    - app store framework and calendar, video, CRM, payment integration families
    - webhooks, tasker, feature flags, email and SMS notifications, workflow reminders
    - data tables and filter segments
    - tRPC and web HTTP API routes
    - prisma models behind these
  excluded:
    - apps/api/v1 and apps/api/v2
    - platform SDK and atoms internals (shown as a boundary)
    - enterprise-only features beyond the workflow reminder hooks the booking path calls
    - marketing and example apps
    - generic UI primitives
    - build tooling
