groups:
  - id: g-apps
    label: App store and integrations
    summary: Shared framework plus calendar, video, CRM, payment families
  - id: g-auth
    label: Auth and credentials
    summary: Login, signup, OAuth provider, credentials
  - id: g-avail
    label: Availability and slots
    summary: Slots, busy times, schedules, reservations
  - id: g-booker
    label: Public booking UI
    summary: Booking pages, Booker widget, dashboards and embeds
  - id: g-booking
    label: Booking lifecycle
    summary: Create, reschedule, cancel, confirm, seats and payments
  - id: g-cal
    label: Calendars and sync
    summary: Calendar manager, event manager, subscriptions and cache
  - id: g-data
    label: Persistence
    summary: Prisma models
  - id: g-events
    label: Event types and forms
    summary: Event type editing, public event data, booking fields, form builder, routing forms
  - id: g-notify
    label: Notifications and side effects
    summary: Emails, SMS, webhooks, tasker, audit and workflows
  - id: g-platform
    label: Platform services
    summary: tRPC, feature flags, data tables
