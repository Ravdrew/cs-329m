title: Cal.com booking-centred component graph
description: Components of the Cal.com web product (calcom/cal.diy) - public booking, availability, calendars, app store, webhooks, tasks and persistence.
x-scope:
  included:
    - public booking pages and Booker UI
    - booking create/reschedule/cancel/confirm
    - slots and availability
    - calendar manager/cache/subscription
    - app-store framework and calendar/video/CRM/payment families
    - routing forms
    - webhooks
    - tasker
    - workflows
    - emails/SMS
    - event types and form builder
    - auth/signup/OAuth/credentials
    - feature flags
    - data tables
    - embeds
    - tRPC and web HTTP APIs
    - prisma models
  excluded:
    - API v1 and v2
    - platform SDK and atoms
    - enterprise-only features beyond workflow scheduling and payments hooks
    - marketing and example apps
    - generic UI primitives
    - build tooling
