    kind: service
    group: g-notify
    summary: Picks sync or Trigger.dev delivery for webhook tasks based on ENABLE_ASYNC_TASKER.
    description: "Follows the BookingEmailAndSmsTasker pattern: a common webhook tasker contract with a sync implementation that runs the consumer immediately and a trigger implementation that queues to Trigger.dev, plus a main tasker that chooses between them. Wired through DI modules and tokens with the bindModuleToClassOnToken pattern."
