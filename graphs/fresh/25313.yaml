groups:
  - id: app-store
    label: App store
    summary: Shared app-store framework and integration families.
  - id: auth
    label: Auth and credentials
    summary: Signup, NextAuth, OAuth provider and credential removal.
  - id: availability
    label: Availability and slots
    summary: Slots computation, schedules, busy times and slot reservation.
  - id: booking-core
    label: Booking lifecycle
    summary: Create, reschedule, cancel, confirm and edit bookings.
  - id: boundaries
    label: Boundaries
    summary: Out-of-scope or external systems the product reaches.
  - id: calendars
    label: Calendars, cache and sync
    summary: Calendar access, cache wrapper, subscriptions and weekly view.
  - id: data-tables
    label: Data tables
    summary: Filterable data table framework and saved filter segments.
  - id: embeds
    label: Embeds
    summary: Embed core iframe SDK and embed react wrapper.
  - id: event-types
    label: Event types and forms
    summary: Event type management, public event data, booking fields, form builder.
  - id: flags
    label: Feature flags
    summary: Feature flag repository and checks.
  - id: http-api
    label: HTTP and tRPC API
    summary: Web HTTP routes and tRPC routers that front the booking services.
  - id: notifications
    label: Email and SMS
    summary: Email manager, templates and booking notification dispatch.
  - id: payments
    label: Payments
    summary: Payment creation, success handling and refunds.
  - id: persistence
    label: Persistence (Prisma models)
    summary: Prisma models that the components read and write.
  - id: ui-booker
    label: Booker UI
    summary: Public booker widget, date and time selection and booking form.
  - id: web-pages
    label: Web pages and views
    summary: Next.js pages and views for booking pages and booking management.
  - id: webhooks-tasks
    label: Webhooks and background tasks
    summary: Webhook triggering and delivery, tasker, cron processing.
nodes:
