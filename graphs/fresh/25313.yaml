title: Cal.com booking product component graph
description: Component graph of the Cal.com web product (calcom/cal.diy) covering public booking, booking management, availability and slots, calendars and sync/caching, event types and forms, notifications, webhooks and tasks, payments, app-store integrations, auth, embeds, data tables and persistence.
x-scope:
  included:
    - Public booker UI, booking pages and booking management pages
    - Booking create, reschedule, cancel, confirm, seat, instant and recurring flows
    - Slots, availability, schedules, busy times
    - Calendar manager, calendar cache and subscription and sync, weekly calendar view
    - Event types, booking fields and form builder
    - Email and SMS notifications
    - Webhooks, tasker background jobs, cron endpoints, feature flags
    - Payments and refunds, app-store framework, OAuth manager, video, CRM and calendar integration families
    - Signup, NextAuth, OAuth provider, credentials deletion
    - Embeds, data tables and filter segments
    - tRPC and web HTTP API entrypoints and Prisma models
  excluded:
    - API v1 and v2
    - Platform SDK and atoms (shown only as the BookerWebWrapper boundary)
    - Enterprise-only features (workflows shown only as a boundary)
    - Marketing and example apps, generic UI primitives, build tooling
