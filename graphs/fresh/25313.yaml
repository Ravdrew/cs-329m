    label: Booking creation HTTP routes
    kind: endpoint
    group: http-api
    summary: /api/book/event, /recurring-event and /instant-event routes.
    description: Apply Turnstile, bot detection and rate limiting, resolve session and delegate to the regular, recurring or instant booking service.
    routes:
      - POST /api/book/event
      - POST /api/book/recurring-event
      - POST /api/book/instant-event
    files:
      - apps/web/pages/api/book/event.ts
