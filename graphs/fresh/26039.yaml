title: Cal.com booking product component graph
description: Components for public booking, booking management, availability and slots, calendars and cache, event types and forms, auth, app-store integrations, notifications (email, webhooks, tasks), platform utilities and persistence.
x-scope:
  included:
    - Public booker UI, booking pages and booking endpoints
    - Booking lifecycle services (create, recurring, instant, seats, cancel, confirm, reschedule, guests, location)
    - Availability, slots, schedules, busy times
    - Calendar manager, calendar cache, subscriptions and sync
    - Event types and form builder
    - Signup, NextAuth, OAuth provider
    - App store framework and calendar, CRM, video, payment integration families
    - Emails, webhooks, tasker, workflow boundary
    - Feature flags, data tables, embeds
    - Prisma models behind these
  excluded:
    - API v1 and v2
    - Platform SDK and atoms
    - Enterprise-only features (workflows shown only as a boundary)
    - Marketing and example apps
    - Generic UI primitives
    - Build tooling
