title: Cal.com booking-centred component graph
description: Components of the Cal.com web product (cal.diy) around public booking, booking management, availability, calendars, app store, notifications, webhooks/tasks, auth and persistence.
x-scope:
  included:
    - public booking pages and Booker UI
    - booking create/cancel/confirm/reschedule/seats/instant services
    - slots, availability, busy times, schedules
    - calendar subscriptions, cache and sync
    - app-store framework with calendar, CRM, video and payment families
    - emails, SMS, workflows, webhooks, tasker, feature flags, booking audit
    - event types, booking fields/form builder, routing forms submission
    - auth, signup, OAuth
    - embed core, data tables, Prisma models
  excluded:
    - API v1 and v2
    - platform SDK and atoms
    - enterprise-only features (except where booking code calls them as a boundary)
    - marketing/example apps, generic UI primitives, build tooling
