title: Cal.com web product component graph
description: Component graph of the Cal.com web product (booking, availability, calendars, event types, auth, embeds, app store, notifications, persistence).
groups:
  - id: g-appstore
    label: App store
    summary: App store framework and integration families
  - id: g-auth
    label: Auth and OAuth
    summary: Signup, next-auth session and OAuth tokens
  - id: g-availability
    label: Availability and slots
    summary: Slots, schedules, busy times and out of office
  - id: g-booking-core
    label: Booking lifecycle
    summary: Create, confirm, reschedule and cancel bookings and their side effects
  - id: g-booking-ui
    label: Booking pages and Booker UI
    summary: Public booking pages and booking management views
  - id: g-calendars
    label: Calendars and cache
    summary: Calendar integrations, calendar sync cache and views
  - id: g-data
    label: Persistence
    summary: Prisma models
  - id: g-embed
    label: Embeds
    summary: Embed snippet runtime and embed configuration UI
  - id: g-eventtypes
    label: Event types and forms
    summary: Event type CRUD, booking fields, form builder and routing forms
  - id: g-external
    label: External boundaries
    summary: Third party systems reached by the product
  - id: g-notify
    label: Webhooks tasks and notifications
    summary: Webhooks, tasker, cron, workflows, email and SMS
  - id: g-platform
    label: Platform services
    summary: tRPC API, feature flags, data tables and payments
