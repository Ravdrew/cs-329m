description: |
  LLM-authored component graph of the public booking flow (Booker UI -> tRPC slots / POST /api/book/event -> RegularBookingService -> Prisma), cancellation (/api/cancel -> handleCancelBooking), reschedule (redirect page + reschedule mode in the same booking service) and host actions (tRPC viewer.bookings confirm / requestReschedule / get). Also the API v2 bookings controller entry. Built only from source spans read in this run; many helper modules are summarised inside the nodes that call them rather than modelled separately.
