  - id: api-cancel
    label: POST/DELETE /api/cancel
    kind: endpoint
    group: api
    summary: App-dir route that cancels a booking by uid with CSRF and rate limit.
    description: Parses body, requires uid (strips numeric id), validates CSRF token, rate-limits per user or IP, then calls handleCancelBooking.
    files:
