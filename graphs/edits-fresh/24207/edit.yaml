    label: Booking HTTP endpoints
    kind: endpoint
    group: booking-api
    summary: /api/book/event and /api/book/recurring-event handlers.
    description: Rate limits, checks Turnstile, loads session then delegates to handleNewBooking or handleNewRecurringBooking.
    files:
      - apps/web/pages/api/book/event.ts
      - apps/web/pages/api/book/recurring-event.ts
      - apps/web/pages/api/book/instant-event.ts
    routes:
      - /api/book/event
      - /api/book/recurring-event
    x-source-evidence:
      - path: apps/web/pages/api/book/event.ts
        start_line: 11
        end_line: 43
    provenance: inferred
    status: modify
    note: Add BotID verification to the `/api/book/event` request path before booking creation can cause side effects. The route assembles the request headers and optional event type ID for `checkBotDetection` and reports an unsuccessful verification through its normal error handling. Keep a disabled rollout from changing ordinary booking behavior. Preserve the route's existing Turnstile, rate limiting, session handling, and booking metadata.
