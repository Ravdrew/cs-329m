title: Cal.com booking product component graph
description: Components of the cal.diy web product centred on public booking, booking management, availability, calendars, apps, webhooks, tasks and persistence.
x-scope:
  included:
    - public booker UI and booking pages
    - booking creation, cancel, confirm and reschedule
    - seats, payments and refunds
    - slots, schedules and availability
    - calendar integrations, caching and subscriptions
    - event types, form builder and routing forms
    - app-store framework with calendar, video, CRM and payment families
    - webhooks and tasker
    - workflows, emails and SMS
    - auth, signup and OAuth
    - embeds, feature flags, data tables, OOO, Prisma models
  excluded:
    - API v1 and v2
    - platform SDK and atoms
    - enterprise-only features
    - marketing and example apps
    - generic UI primitives
    - build tooling
