  - id: booking-sheet-keyboard-handler
    label: Booking sheet keyboard handler
    kind: other
    group: booking-ui
    summary: Booking sheet shortcuts.
    files: []
    provenance: manual
    status: new
    note: Extract booking-sheet keyboard handling into the specified utility. Only handle shortcuts while the sheet is active and the target is not editable. Treat focus inside a different Radix portal as an active overlay whose keys belong to that overlay, while allowing shortcuts when focus is inside the sheet or outside any portal. For ArrowUp and ArrowDown, always prevent the default action and stop propagation when the sheet owns the event, including at the first and last booking. Call the previous or next handler only when that direction is available and a transition is not already in progress. For Enter, activate the current join link when present and consume the event so a focused actions button cannot also open; leave unrelated keys and Enter without a join action alone.
