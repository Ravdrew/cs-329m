title: Cal.com booking component graph
description: Booking, availability, calendar, app-store, webhook, notification, task and persistence components of calcom/cal.diy.
x-scope:
  included:
    - public booking UI (Booker, booking pages) and booking management lists
    - booking creation, seats, recurring, instant, confirm, reject, cancel, request-reschedule
    - slots, availability, schedules, slot reservation
    - calendar manager, calendar subscription/cache/sync, EventManager, video client
    - app-store framework with calendar, CRM, video and payment families, OAuth manager
    - webhooks, tasker, email and SMS notification, workflows boundary
    - event types, booking fields/form builder, routing forms submission
    - auth, signup, OAuth token endpoint, embeds, feature flags, data tables, prisma models
  excluded:
    - API v1 and v2, platform SDK and atoms
    - enterprise-only features beyond boundary nodes (workflows, PBAC, organizations)
    - marketing and example apps, generic UI primitives, build tooling
