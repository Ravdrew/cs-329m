title: Cal.com booking product component graph
description: Component graph of the Cal.com web product (cal.diy) covering public booking, availability and slots, calendars and sync, app-store integrations, payments, notifications, webhooks, tasks, auth, embeds, data tables and persistence.
x-scope:
  included:
    - Public booking UI (Booker, booking pages, success page, bookings list)
    - Booking creation, confirmation, reschedule, cancellation, seats, recurring, instant, round-robin reassignment
    - Availability, slots, schedules, busy times, slot reservation
    - Calendar manager, calendar cache, calendar subscriptions and sync
    - App store framework, OAuth manager, credentials, calendar, video, CRM and payment integration families
    - Email, SMS and workflow reminders
    - Webhooks, tasker, feature flags, spam and bot detection
    - Event types, booking fields, form builder
    - Signup, authentication, OAuth provider
    - Embeds
    - Data table framework and filter segments
    - tRPC booking, slots, event type, availability and calendar routers; web HTTP APIs; Prisma persistence
  excluded:
    - API v1 and v2 apps (shown as boundary only)
    - Platform SDK and atoms (shown as boundary only)
    - Enterprise-only features (billing, SSO, dsync, organizations admin, PBAC admin)
    - Marketing and example apps, generic UI primitives, build tooling
