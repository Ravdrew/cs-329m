groups:
  - id: app-store
    label: App store framework
    summary: Shared app framework, OAuth, credentials and integration families
  - id: auth
    label: Signup and authentication
    summary: Signup, NextAuth login and OAuth provider
  - id: availability
    label: Availability and slots
    summary: Slots computation, busy times, schedules, reservations
  - id: booking-core
    label: Booking lifecycle
    summary: Creating, confirming, rescheduling, cancelling and reassigning bookings
  - id: booking-ui
    label: Public booking UI
    summary: Booker, booking pages, success page and booking list views
  - id: boundaries
    label: External boundaries
    summary: Third party services and out-of-scope code
  - id: calendars
    label: Calendars and sync
    summary: Calendar manager, caching, subscriptions and calendar integrations
  - id: data-tables
    label: Data tables and lists
    summary: Filterable data table framework, segments
  - id: embeds
    label: Embeds
    summary: Embed snippet runtime and embed configuration UI
  - id: eventtypes-forms
    label: Event types and forms
    summary: Event type editing, public event data, booking fields and form builder
  - id: notifications
    label: Email, SMS and workflows
    summary: Transactional emails, SMS and workflow reminders
  - id: payments
    label: Payments
    summary: Payment collection, refunds and payment webhooks
  - id: persistence
    label: Persistence
    summary: Prisma models
  - id: web-api
    label: Web and tRPC APIs
    summary: HTTP route handlers and tRPC routers that front the booking logic
  - id: webhooks-tasks
    label: Webhooks, tasks and flags
    summary: Webhook delivery, tasker background jobs, feature flags, abuse protection
