title: Cal.com booking product component graph
description: Components of the Cal.com web product centred on booking, availability, calendars, app-store integrations, webhooks/tasks, notifications and persistence.
x-scope:
  included:
    - Public booking pages, Booker UI, booking form and form builder
    - Booking creation, recurring, instant, seated, confirm, reschedule-request and cancel flows
    - Slots, user availability, schedules, calendar cache, subscription and sync
    - App-store framework, OAuth manager, Google Calendar, Stripe, Salesforce CRM and Daily video integrations
    - Webhooks, tasker background tasks, feature flags, email and SMS notifications, workflow reminders
    - Data tables, bookings list and calendar views, embeds, signup/auth/OAuth, event types, tRPC and web HTTP APIs, Prisma models
  excluded:
    - apps/api v1 and v2, platform SDK and atoms
    - enterprise-only features beyond booking hooks (workflow engine internals, organizations, pbac)
    - marketing and example apps, generic UI primitives, build tooling
