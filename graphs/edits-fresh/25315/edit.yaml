    provenance: manual
    status: new
    note: New service that centralizes conferencing-credential authorization, exposing `ensureAccessible`. Load the credential through `CredentialRepository.findFirstByIdWithKeyAndUser` and evaluate access using the authenticated user's ID and the booking owner's ID. Cover direct ownership and credentials made available through the applicable team or organization relationship. Use `UserRepository.getUserOrganizationAndTeams` for accepted team memberships and organizational context rather than treating an unaccepted invitation or an unrelated team as access. Keep the distinction between the editor, booking owner, and credential owner explicit, including a missing booking owner. Reject a missing credential or a relationship that does not grant access before returning to the handler. Make the successful service result simply mean that the existing location-update flow may continue. Allow an optional Prisma client for dependency injection with the normal client as its default.
