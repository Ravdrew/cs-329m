groups:
  - id: appstore
    label: App store
    summary: Shared framework and integration families.
  - id: auth
    label: Auth, OAuth and credentials
    summary: Signup, sessions, OAuth provider and credential management.
  - id: availability
    label: Availability and slots
    summary: Slots computation, user availability, busy times, schedules and OOO.
  - id: booking-core
    label: Booking core
    summary: Create, confirm, reschedule, cancel services and their orchestration.
  - id: booking-ui
    label: Booking UI
    summary: Public booker, booking pages, booking lists and calendar views.
  - id: boundary
    label: External boundary
    summary: Third-party systems the product reaches.
  - id: calendars
    label: Calendars
    summary: Calendar access, subscriptions, cache and sync.
  - id: data
    label: Data tables
    summary: Filterable tables and segments.
  - id: embeds
    label: Embeds
    summary: Embed SDK and in-iframe runtime.
  - id: entrypoints
    label: HTTP and tRPC entrypoints
    summary: Next.js routes and tRPC routers that receive client and provider calls.
  - id: eventtypes
    label: Event types and forms
    summary: Event type editing and the booking form builder.
  - id: notifications
    label: Notifications
    summary: Email, SMS and workflow reminders.
  - id: persistence
    label: Persistence
    summary: Prisma models.
  - id: platform
    label: Webhooks, tasks and flags
    summary: Webhook delivery, background tasker and feature flags.
