title: Cal.com booking product graph (cal.diy)
description: Component graph of the Cal.com web product - public booking, availability/slots, calendars, event types, auth, embeds, app store, webhooks/tasks, notifications and persistence.
x-scope:
  included:
    - public booking UI and booking pages
    - booking creation, confirmation, rescheduling, cancellation, seats, recurring and instant bookings
    - availability, slots, schedules, OOO
    - calendars, calendar subscription, cache and sync
    - event types and form builder
    - signup, auth, OAuth, credentials
    - embeds
    - app-store framework with calendar, video, CRM and payment families
    - webhooks, tasker, feature flags
    - email, SMS and workflow notifications
    - data tables and booking lists
    - tRPC and web HTTP endpoints; prisma models
  excluded:
    - API v1 and v2
    - platform SDK and atoms
    - enterprise-only features beyond the boundary touchpoints (workflows, billing credits)
    - marketing and example apps
    - generic UI primitives
    - build tooling
