    label: Booking core
    summary: Create, confirm, cancel, reschedule logic and side effects
  - id: g-booking-ui
    label: Booking UI
    summary: Public booker and booking management screens
  - id: g-calendars
    label: Calendars
    summary: Calendar access, subscription cache and sync
  - id: g-data-tables
    label: Data tables
    summary: Filterable tables and saved segments
  - id: g-embeds
    label: Embeds
    summary: Embed SDK and iframe runtime
  - id: g-event-types
    label: Event types and forms
    summary: Event type editing, public events and form builder
  - id: g-notifications
    label: Email and SMS
    summary: Email templates and SMS notifications
  - id: g-payments
    label: Payments
    summary: Payment collection and refunds
  - id: g-webhooks-tasks
    label: Webhooks, tasks and flags
    summary: Webhook delivery, tasker and feature flags
