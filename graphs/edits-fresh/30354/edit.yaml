title: Cal.diy booking product component graph
description: Component-level map of public booking, booking management, availability/slots, calendars, app store, payments, webhooks/tasker, auth, embeds and data tables in calcom/cal.diy.
x-scope:
  included:
    - Public booker UI, booking creation, cancel, confirm/reject, reschedule request, add guests, edit location
    - Slots, availability, schedules, busy times, slot reservation
    - Calendar manager, calendar subscription cache and sync, Google and other calendar integrations
    - App store framework, OAuth token manager, video, CRM, payment integrations
    - Webhooks, tasker, feature flags, email and SMS notifications
    - Event types, form builder, public event loading
    - Signup, NextAuth credentials, OAuth provider, embeds, data tables and filter segments
    - tRPC server wiring, web HTTP API routes, Prisma models touched by bookings
  excluded:
    - API v1 and v2 apps
    - Platform SDK and atoms
    - Enterprise-only features
    - Marketing and example apps
    - Generic UI primitives (packages/ui)
    - Build tooling
