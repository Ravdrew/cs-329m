title: Cal.com booking product component graph
description: Component graph of the cal.diy web product (booking, availability, calendars, event types, app store, notifications, webhooks/tasks, auth, embeds) at commit 267686704d.
x-scope:
  included:
    - public booking UI and booking management (list and calendar views)
    - booking creation, reschedule, cancel, confirm, seats, instant and recurring services
    - availability, slots, schedules, busy times
    - calendar manager, calendar subscription cache and sync, destination calendars
    - event types, booking fields, form builder, routing forms
    - signup, next-auth, OAuth service, credentials
    - embed core and iframe SDK
    - app store framework and calendar, video, CRM and payment families
    - email and SMS notifications, webhooks, tasker, feature flags, data tables
    - tRPC routers and web HTTP API routes, prisma models
  excluded:
    - API v1 and v2, platform SDK and atoms
    - enterprise-only features (workflows, billing, organizations, booking audit internals, PBAC), shown as boundaries
    - marketing and example apps, generic UI primitives, build tooling, tests
