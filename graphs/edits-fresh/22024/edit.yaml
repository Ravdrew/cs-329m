title: Cal.com booking product graph
description: Component graph of the Cal.com web product (cal.diy) centred on booking creation, confirmation, rescheduling and cancellation, with availability, calendar and app-store integrations, notifications, webhooks, tasks and supporting UI.
x-scope:
  included:
    - public booking pages and Booker UI
    - booking creation/cancel/confirm/reschedule/seats
    - slots and availability
    - calendar manager and cache
    - video/CRM/payment integration families
    - emails and SMS
    - webhooks
    - tasker
    - feature flags
    - event types and form builder
    - auth/signup/OAuth
    - embeds
    - data tables
    - prisma Booking model
  excluded:
    - API v1 and v2
    - platform SDK and atoms
    - enterprise-only features (workflows shown as boundary)
    - marketing and example apps
    - generic UI primitives
    - build tooling
