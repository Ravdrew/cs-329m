  - id: available-slots
    label: Available slots service
    kind: service
    group: availability
    summary: Computes event slots using repositories and availability dependencies.
    description: Includes reserved-slot lookup and expiry cleanup and a Redis cache wrapper; additional calculation branches are traced separately.
    files:
