title: Public booking and host management in Cal.diy
description: Source-traced component graph of the web booking lifecycle and selected host-management paths. Components group related UI hooks and server implementation; conditional integration boundaries are distinguished from unconditional calls.
x-scope:
  included:
    - Individual public event page and SSR event loading, booker orchestration, conditional slot queries and regular booking submission.
    - Availability computation and submission-time conflict checks, Prisma booking creation and non-seated reschedule transaction, provider-event facade calls.
    - Booking detail cancellation UI, UID cancellation HTTP endpoint, cancellation persistence and conditional integration cleanup, reschedule redirect entry.
    - Host event editor and create/update RPC, schedule listing/default/update service, bookings list and confirmation/rejection/request-reschedule RPC.
  excluded:
    - Exhaustive API v1/v2 and platform SDK topology; team API-v2 slot branch is identified but not expanded.
    - Recurring submission orchestration, seated-booking internals, slot-reservation endpoints and full round-robin/routing algorithms.
    - Notification delivery, workflow/job queues, webhooks, payments/refunds, bot detection and authentication internals beyond inspected call boundaries.
    - Concrete calendar/video/CRM adapters, host calendar-connection settings, profile/team/organization administration, billing, event deletion and full schedule CRUD.
    - Booking calendar-view internals, all booking detail SSR data retrieval, embed variants, decoy and dry-run success pages.
