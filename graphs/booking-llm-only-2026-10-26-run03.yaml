    label: Booking confirmation action hook
    kind: component
    group: host
    summary: Executes host confirmation or rejection and invalidates booking queries.
    description: bookingConfirm invokes the confirm mutation and includes recurringEventId only for applicable tabs and series; handles rejection dialog and toast state.
    files:
