  - id: api-book-event
    label: POST /api/book/event
    kind: endpoint
    group: api
    summary: Pages API route that applies turnstile, bot detection, rate limit and delegates to RegularBookingService.
    description: Optionally checks Cloudflare Turnstile (env flag), runs BotDetectionService, rate-limits by hashed IP, reads the session, sets creationSource WEBAPP, and calls regularBookingService.createBooking.
    files:
      - apps/web/pages/api/book/event.ts
    routes:
      - /api/book/event
    x-source-evidence:
      - path: apps/web/pages/api/book/event.ts
        start_line: 1
        end_line: 63
        excerpt: |-
          import process from "node:process";
          import { getServerSession } from "@calcom/features/auth/lib/getServerSession";
          import { getRegularBookingService } from "@calcom/features/bookings/di/RegularBookingService.container";
          import { BotDetectionService } from "@calcom/features/bot-detection";
          import { EventTypeRepository } from "@calcom/features/eventtypes/repositories/eventTypeRepository";
          import { FeaturesRepository } from "@calcom/features/flags/features.repository";
          import { checkRateLimitAndThrowError } from "@calcom/lib/checkRateLimitAndThrowError";
          import getIP from "@calcom/lib/getIP";
          import { checkCfTurnstileToken } from "@calcom/lib/server/checkCfTurnstileToken";
          import { defaultResponder } from "@calcom/lib/server/defaultResponder";
          import { piiHasher } from "@calcom/lib/server/PiiHasher";
          import type { TraceContext } from "@calcom/lib/tracing";
          import { prisma } from "@calcom/prisma";
          import { CreationSource } from "@calcom/prisma/enums";
          import type { NextApiRequest } from "next";

          async function handler(req: NextApiRequest & { userId?: number; traceContext: TraceContext }) {
            const userIp = getIP(req);

            if (process.env.NEXT_PUBLIC_CLOUDFLARE_USE_TURNSTILE_IN_BOOKER === "1") {
              await checkCfTurnstileToken({
                token: req.body["cfToken"] as string,
                remoteIp: userIp,
              });
            }

            // Check for bot detection using feature flag
            const featuresRepository = new FeaturesRepository(prisma);
            const eventTypeRepository = new EventTypeRepository(prisma);
            const botDetectionService = new BotDetectionService(featuresRepository, eventTypeRepository);

            await botDetectionService.checkBotDetection({
              eventTypeId: req.body.eventTypeId,
              headers: req.headers,
            });

            await checkRateLimitAndThrowError({
              rateLimitingType: "core",
              identifier: `createBooking:${piiHasher.hash(userIp)}`,
            });

            const session = await getServerSession({ req });
            /* To mimic API behavior and comply with types */
            req.body = {
              ...req.body,
              creationSource: CreationSource.WEBAPP,
            };

            const regularBookingService = getRegularBookingService();
            const booking = await regularBookingService.createBooking({
              bookingData: req.body,
              bookingMeta: {
                userId: session?.user?.id || -1,
                hostname: req.headers.host || "",
                forcedSlug: req.headers["x-cal-force-slug"] as string | undefined,
                traceContext: req.traceContext,
              },
            });

            return booking;
          }

          export default defaultResponder(handler, "/api/book/event");
