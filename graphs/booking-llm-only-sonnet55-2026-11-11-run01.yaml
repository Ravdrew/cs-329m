  - id: booker-form-hook
    label: useBookingForm
    kind: component
    group: ui
    summary: react-hook-form setup validating responses against event booking fields.
    description: Builds a zod schema from the event's bookingFields via getBookingResponsesSchema and initial values from reschedule data in the booker store.
    files:
