description: |
  LLM-authored component graph of the public booking flow in calcom/cal.diy: public booker UI, slot lookup and reservation (tRPC viewer.slots), booking submission (/api/book/event and /api/book/recurring-event into RegularBookingService / RecurringBookingService), persistence (Prisma Booking, SelectedSlots), cancellation (/api/cancel), rescheduling (reschedule page plus booking submit with rescheduleUid, host request-reschedule), and host management (bookings list, confirm/decline).
  Edges describe calls seen in the cited source; conditional branches and external boundaries are noted in the edge descriptions.
