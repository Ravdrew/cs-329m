description: Source-traced component graph of the web public booking lifecycle and principal host schedule, event-type editing and booking-list paths at the pinned commit. Components group cooperating implementation files, not deployment units. Edges distinguish render/navigation, callback-driven HTTP/RPC calls, service calls and persistent-domain access. Calendar/video/CRM and confirmation boundaries are represented where inspected; this is deliberately not a complete repository graph.
