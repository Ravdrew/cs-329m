  - id: booking-persistence
    label: Transactional booking creation
    kind: service
    group: lifecycle
    summary: Builds and atomically saves booking and reschedule changes.
    description: Constructs nested booking data and runs a Prisma transaction updating the original booking when applicable before creating the replacement. Non-seated reschedules mark the old booking CANCELLED and rescheduled and connect the replacement through fromReschedule; successful payment can be reconnected.
    files:
      - packages/features/bookings/lib/handleNewBooking/createBooking.ts
    x-source-evidence:
      - path: packages/features/bookings/lib/handleNewBooking/createBooking.ts
        start_line: 60
        end_line: 152
        excerpt: |-
          // Define the function with underscore prefix
          const _createBooking = async ({
            uid,
            reqBody,
            eventType,
            input,
            evt,
            originalRescheduledBooking,
            rescheduledBy,
            creationSource,
            tracking,
          }: CreateBookingParams & { rescheduledBy: string | undefined }) => {
            updateEventDetails(evt, originalRescheduledBooking);

            const bookingAndAssociatedData = buildNewBookingData({
              uid,
              rescheduledBy,
              reqBody,
              eventType,
              input,
              evt,
              originalRescheduledBooking,
              creationSource,
              tracking,
            });

            return await saveBooking(
              bookingAndAssociatedData,
              originalRescheduledBooking,
              eventType.paymentAppData,
              eventType.organizerUser
            );
          };

          export const createBooking = withReporting(_createBooking, "createBooking");

          async function saveBooking(
            bookingAndAssociatedData: ReturnType<typeof buildNewBookingData>,
            originalRescheduledBooking: OriginalRescheduledBooking,
            paymentAppData: PaymentAppData,
            organizerUser: CreateBookingParams["eventType"]["organizerUser"]
          ) {
            const { newBookingData, originalBookingUpdateDataForCancellation } = bookingAndAssociatedData;
            const createBookingObj = {
              include: {
                user: {
                  select: {
                    uuid: true,
                    email: true,
                    name: true,
                    timeZone: true,
                    username: true,
                    isPlatformManaged: true,
                  },
                },
                attendees: true,
                payment: true,
                references: true,
              },
              data: newBookingData,
            };

            if (originalRescheduledBooking?.paid && originalRescheduledBooking?.payment) {
              const bookingPayment = originalRescheduledBooking.payment.find((payment) => payment.success);
              if (bookingPayment) {
                createBookingObj.data.payment = { connect: { id: bookingPayment.id } };
              }
            }

            if (typeof paymentAppData.price === "number" && paymentAppData.price > 0) {
              await prisma.credential.findFirstOrThrow({
                where: {
                  appId: paymentAppData.appId,
                  ...(paymentAppData.credentialId ? { id: paymentAppData.credentialId } : { userId: organizerUser.id }),
                },
                select: { id: true },
              });
            }

            return prisma.$transaction(async (tx) => {
              if (originalBookingUpdateDataForCancellation) {
                await tx.booking.update(originalBookingUpdateDataForCancellation);
              }

              const booking = await tx.booking.create(createBookingObj);

              return { ...booking, userUuid: booking.user?.uuid ?? null };
            });
          }

          function getEventTypeRel(eventTypeId: EventTypeId) {
            return eventTypeId ? { connect: { id: eventTypeId } } : {};
          }
