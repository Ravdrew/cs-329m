  - id: booking-api
    label: Web booking HTTP endpoint
    kind: endpoint
    group: lifecycle
    summary: Applies abuse checks and session context before creating a booking.
    description: Optional Turnstile validation, bot detection and rate limiting precede RegularBookingService.createBooking; creation source is WEBAPP.
    files:
      - apps/web/pages/api/book/event.ts
