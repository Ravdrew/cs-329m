    label: /api/book/event
    kind: endpoint
    group: lifecycle
    summary: Checks abuse controls and session context before creating a booking.
    description: Applies optional Turnstile, bot checks and rate limiting, stamps WEBAPP creation source, then calls the regular booking service with session and request metadata.
