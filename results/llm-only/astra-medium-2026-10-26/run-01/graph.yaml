description: Source-traced component graph of the web booking lifecycle and selected host-management paths. Edges describe executed calls or explicitly identified UI callbacks; conditional integration boundaries are not treated as unconditional effects.
x-scope:
  included:
    - Personal public event route, SSR event resolution and web booker form/query composition
    - Public slots RPC, host availability aggregation, busy-calendar boundary and submission-time checks
    - Regular booking POST, transactional creation and reschedule replacement, cancellation POST/DELETE and integration orchestration
    - Public booking detail change controls and reschedule redirect entrypoint
    - Host availability list/edit and schedule update persistence
    - Host event-type list/edit entrypoints and event configuration update RPC
    - Host booking list query and pending booking confirmation/rejection path
    - Prisma Booking/Attendee/BookingReference, EventType and Schedule/Availability aggregates
  excluded:
    - API v1 and API v2 platform controllers; team API-v2 slots branch is identified but not expanded
    - Full team/dynamic/hashed/embed route variants, routing forms and instant bookings
    - Recurring booking submission service, seated-booking internals and slot reservation implementation
    - Payment processing, webhook/workflow fanout, email/SMS delivery and background job implementations
    - Individual calendar/video/CRM providers, OAuth and host calendar-connection settings
    - Exhaustive event-type create/delete/duplicate paths, availability create/delete internals and host profile settings
    - Booking-successful redirect internals, full booking-detail SSR, audit/history and calendar list presentation
    - Enterprise organizations, permission internals, billing and administration
