title: Cal.com booking subsystem components
description: Responsibility-oriented grouping of the pinned structural input, grounded in implementation and static coupling. Edges are derived by the host.
x-scope:
  repo: calcom/cal.com
  commit: 54343aa685ae8f33159d2f485ec4a57bad5c574a
  input: 738 indexed files and 11525 structural nodes in the fixed booking-scoped subgraph.
  included:
    - Web public booking, embed, result and management UI.
    - Web HTTP and tRPC booking and slot APIs, availability and booking lifecycle services.
    - Indexed persistence adapters, calendar coordination, email, SMS and webhook code.
    - Supporting packages include indexed non-booking-exclusive utilities, maintenance scripts and templates.
  excluded:
    - API v2.
    - Generic UI and authentication utilities outside the indexed boundary.
    - Provider-specific app-store implementations.
    - All other unindexed repository code and generated models not present in the input.
  limits: Static links do not prove runtime workflows. Calls and navigation are retained and other dependency kinds become uses; the graph does not distinguish reads, writes or renders. Low and unknown confidence links are retained. Component boundaries are inferred, not established by schema validation.
