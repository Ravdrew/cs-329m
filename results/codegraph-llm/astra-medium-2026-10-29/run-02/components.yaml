title: Cal.com booking subsystem components
description: Responsibility-oriented grouping of the pinned booking-scoped structural graph. Memberships are inferred from indexed dependencies and representative implementation reads; cross-component links are derived mechanically from static edges.
x-scope:
  repo: calcom/cal.com
  commit: 54343aa685ae8f33159d2f485ec4a57bad5c574a
  input: 11525 structural nodes in 738 indexed files, with 20363 static edges.
  included:
    - Public booking, embedded booking, rescheduling and booking management web UI.
    - Web HTTP and tRPC booking and slot APIs, availability and booking lifecycle services.
    - Indexed persistence adapters and supporting calendar, email, SMS and webhook code.
    - Indexed non-booking-exclusive supporting code, including account email variants and Prisma maintenance scripts.
  excluded:
    - Repository files and structural nodes outside the fixed booking-scoped input.
    - API v2, generic UI and authentication utilities, and provider-specific app-store implementations.
    - Runtime workflow inference, missing-edge inference, and distinctions between reads, writes or renders not present in the supplied static graph.
  limits: Not the whole repository. Memberships are inferred from static dependencies and representative source reads. Mechanically aggregated links retain low or unknown static confidence and do not establish runtime business workflows or semantic correctness.
