            protected getTimezone() {
              return "";
            }

            protected getLocale(): string {
              return "";
            }

            protected getFormattedRecipientTime({ time, format }: { time: string; format: string }) {
              return dayjs(time).tz(this.getTimezone()).locale(this.getLocale()).format(format);
