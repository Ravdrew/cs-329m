title: Cal.com booking subsystem components
description: Responsibility-based grouping of the pinned booking-scoped structural graph. Memberships are inferred from implementation and static dependencies; links are derived mechanically from the supplied graph.
x-scope:
  repo: calcom/cal.com
  commit: 54343aa685ae8f33159d2f485ec4a57bad5c574a
  input: 738 indexed files and 11525 structural nodes.
  included:
    - Public web booking, embed, rescheduling, result and management UI.
    - Web HTTP and tRPC booking and slot APIs, availability and booking lifecycle services.
    - Indexed supporting calendar, email, SMS, webhook, audit and database-client code, including non-booking-exclusive utilities and templates.
  excluded:
    - API v2 and unindexed repository files.
    - Generic UI and authentication utilities outside the selected input.
    - Provider-specific app-store implementations.
  limitations:
    - This is a preselected booking-scoped subgraph, not the whole repository.
    - Static calls and navigation are preserved; imports, references, inheritance, implementation and instantiation become uses.
    - Links do not establish runtime workflows or distinguish database reads, writes or UI rendering.
    - Low and unknown confidence input links are retained; schema validation does not establish semantic accuracy.
